name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: swift --version

      - name: Test
        run: ./scripts/test.sh

      - name: Build app bundle
        run: UNIVERSAL=1 BUILD_NUMBER=${{ github.run_number }} ./scripts/build-app.sh

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: Hoopoe-${{ github.sha }}
          path: dist/Hoopoe.app
          retention-days: 7
